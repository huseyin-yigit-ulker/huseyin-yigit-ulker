<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="100%" height="32">
  <defs>
    <linearGradient id="pulseBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <clipPath id="lineMask">
      <rect x="0" y="0" width="1200" height="32" />
    </clipPath>
  </defs>

  <g clip-path="url(#lineMask)">
    <!-- Base subtle line + center alpha ECG wave -->
    <path
      d="M 20 16 L 545 16 L 558 16 L 566 7 L 576 25 L 588 4 L 600 27 L 612 9 L 622 21 L 630 16 L 1180 16"
      fill="none"
      stroke="#1E293B"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Center Highlighted Waveform -->
    <path
      d="M 555 16 L 566 7 L 576 25 L 588 4 L 600 27 L 612 9 L 622 21 L 632 16"
      fill="none"
      stroke="#10B981"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.85"
    />

    <!-- Sweeping Laser Pulse -->
    <rect x="-320" y="14.5" width="320" height="3" rx="1.5" fill="url(#pulseBeam)">
      <animate attributeName="x" from="-320" to="1220" dur="4.2s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
