<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 264" width="100%" height="264">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080F1E" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>

    <clipPath id="parcelClip">
      <rect x="0" y="0" width="340" height="58" rx="8" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- ==================== CARD 1: QUANT & HFT ==================== -->
  <g transform="translate(8, 6)">
    <rect x="0" y="0" width="380" height="252" rx="14" fill="url(#cardBg)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.45" />
    <rect x="0" y="0" width="380" height="4" rx="2" fill="#10B981" />

    <!-- Header -->
    <text x="20" y="30" class="mono" font-size="11" font-weight="700" fill="#10B981" letter-spacing="0.8">01 // FINTECH &amp; QUANT TRADING</text>
    <text x="20" y="52" class="sans" font-size="16.5" font-weight="700" fill="#F8FAFC">Piyasa Mikroyapısı &amp; Otonom İcra</text>

    <!-- Animated Order Book Imbalance Widget -->
    <g transform="translate(20, 66)">
      <rect x="0" y="0" width="340" height="58" rx="8" fill="#0B1526" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="19" class="mono" font-size="10" font-weight="700" fill="#34D399">BID DEPTH (ALICI)</text>
      <text x="236" y="19" class="mono" font-size="10" font-weight="700" fill="#FB7185">ASK DEPTH (SATICI)</text>

      <!-- Ask Background Bar -->
      <rect x="12" y="28" width="316" height="10" rx="5" fill="#F43F5E" fill-opacity="0.8" />
      <!-- Animated Bid Foreground Bar -->
      <rect x="12" y="28" width="224" height="10" rx="5" fill="#10B981">
        <animate attributeName="width" values="215;242;198;234;215" dur="4.5s" repeatCount="indefinite" />
      </rect>

      <text x="12" y="51" class="mono" font-size="9.5" fill="#94A3B8">LOB IMBALANCE: <tspan fill="#34D399" font-weight="700">+0.72 BULLISH</tspan></text>
      <text x="226" y="51" class="mono" font-size="9.5" fill="#FBBF24">SPREAD: 0.01%</text>
    </g>

    <!-- Feature Bullets -->
    <g transform="translate(20, 146)" class="sans" font-size="12.8" fill="#CBD5E1">
      <text x="0" y="0"><tspan fill="#10B981" font-weight="700">▸</tspan> Limit Order Book (LOB) dengesizliği &amp; akış analizi</text>
      <text x="0" y="24"><tspan fill="#10B981" font-weight="700">▸</tspan> Gerçek zamanlı FFT tabanlı spoofing filtreleme</text>
      <text x="0" y="48"><tspan fill="#10B981" font-weight="700">▸</tspan> PPO pekiştirmeli öğrenme &amp; SMC likidite avcılığı</text>
      <text x="0" y="72"><tspan fill="#10B981" font-weight="700">▸</tspan> Sıfır-bilgi RSA şifreli canlı vadeli işlem motoru</text>
    </g>
  </g>

  <!-- ==================== CARD 2: MULTIMODAL & DEEP AI ==================== -->
  <g transform="translate(410, 6)">
    <rect x="0" y="0" width="380" height="252" rx="14" fill="url(#cardBg)" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.45" />
    <rect x="0" y="0" width="380" height="4" rx="2" fill="#06B6D4" />

    <!-- Header -->
    <text x="20" y="30" class="mono" font-size="11" font-weight="700" fill="#22D3EE" letter-spacing="0.8">02 // MULTIMODAL &amp; DEEP LEARNING</text>
    <text x="20" y="52" class="sans" font-size="16.5" font-weight="700" fill="#F8FAFC">Çok Modlu Ajanlar &amp; Bilgisayarlı Görü</text>

    <!-- Animated Neural Inference Widget -->
    <g transform="translate(20, 66)">
      <rect x="0" y="0" width="340" height="58" rx="8" fill="#0B1526" stroke="#1E293B" stroke-width="1" />

      <!-- Synaptic Edges -->
      <path id="syn1" d="M 38 14 L 138 18 L 242 29" fill="none" stroke="#1E293B" stroke-width="1.3" />
      <path id="syn2" d="M 38 29 L 138 40 L 242 29" fill="none" stroke="#1E293B" stroke-width="1.3" />
      <path id="syn3" d="M 38 44 L 138 18 L 242 29" fill="none" stroke="#1E293B" stroke-width="1.3" />
      <line x1="38" y1="14" x2="138" y2="40" stroke="#1E293B" stroke-width="1" />
      <line x1="38" y1="44" x2="138" y2="40" stroke="#1E293B" stroke-width="1" />

      <!-- Travelling Data Orbs -->
      <circle r="3" fill="#22D3EE">
        <animateMotion dur="2.2s" repeatCount="indefinite" path="M 38 14 L 138 18 L 242 29" />
      </circle>
      <circle r="3" fill="#10B981">
        <animateMotion dur="2.7s" repeatCount="indefinite" path="M 38 44 L 138 18 L 242 29" />
      </circle>
      <circle r="3" fill="#FBBF24">
        <animateMotion dur="1.9s" repeatCount="indefinite" path="M 38 29 L 138 40 L 242 29" />
      </circle>

      <!-- Nodes -->
      <circle cx="38" cy="14" r="4.5" fill="#06B6D4" />
      <circle cx="38" cy="29" r="4.5" fill="#06B6D4" />
      <circle cx="38" cy="44" r="4.5" fill="#06B6D4" />

      <circle cx="138" cy="18" r="5" fill="#38BDF8" />
      <circle cx="138" cy="40" r="5" fill="#38BDF8" />

      <circle cx="242" cy="29" r="6" fill="#10B981">
        <animate attributeName="r" values="5;7.5;5" dur="1.6s" repeatCount="indefinite" />
      </circle>

      <text x="262" y="25" class="mono" font-size="9.5" font-weight="700" fill="#22D3EE">INFERENCE</text>
      <text x="262" y="39" class="mono" font-size="9.5" fill="#94A3B8">98.9% mAP</text>
    </g>

    <!-- Feature Bullets -->
    <g transform="translate(20, 146)" class="sans" font-size="12.8" fill="#CBD5E1">
      <text x="0" y="0"><tspan fill="#22D3EE" font-weight="700">▸</tspan> Gemini Multimodal Vision &amp; otonom web ajanları</text>
      <text x="0" y="24"><tspan fill="#22D3EE" font-weight="700">▸</tspan> YOLOv8 gerçek zamanlı nesne tespiti (%98.9 mAP)</text>
      <text x="0" y="48"><tspan fill="#22D3EE" font-weight="700">▸</tspan> DeBERTa tabanlı Doğal Dil Çıkarımı (SNLI / ANLI)</text>
      <text x="0" y="72"><tspan fill="#22D3EE" font-weight="700">▸</tspan> Dermoskopik görüntülemede Transfer Öğrenmesi</text>
    </g>
  </g>

  <!-- ==================== CARD 3: AGRITECH & SPATIAL SAAS ==================== -->
  <g transform="translate(812, 6)">
    <rect x="0" y="0" width="380" height="252" rx="14" fill="url(#cardBg)" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.45" />
    <rect x="0" y="0" width="380" height="4" rx="2" fill="#F59E0B" />

    <!-- Header -->
    <text x="20" y="30" class="mono" font-size="11" font-weight="700" fill="#FBBF24" letter-spacing="0.8">03 // AGRITECH &amp; CLOUD SAAS</text>
    <text x="20" y="52" class="sans" font-size="16.5" font-weight="700" fill="#F8FAFC">Coğrafi Veri &amp; Ölçeklenebilir Ürünler</text>

    <!-- Animated PostGIS Satellite Parcel Scanner Widget -->
    <g transform="translate(20, 66)" clip-path="url(#parcelClip)">
      <rect x="0" y="0" width="340" height="58" rx="8" fill="#0B1526" stroke="#1E293B" stroke-width="1" />

      <!-- Satellite Parcel Polygon -->
      <polygon
        points="28,44 52,12 128,10 154,32 118,48 48,49"
        fill="#10B981"
        fill-opacity="0.18"
        stroke="#34D399"
        stroke-width="1.5"
      />
      <!-- Parcel Vertices -->
      <circle cx="28" cy="44" r="2.5" fill="#FBBF24" />
      <circle cx="52" cy="12" r="2.5" fill="#FBBF24" />
      <circle cx="128" cy="10" r="2.5" fill="#FBBF24" />
      <circle cx="154" cy="32" r="2.5" fill="#FBBF24" />
      <circle cx="118" cy="48" r="2.5" fill="#FBBF24" />

      <!-- Sweeping Radar Scan Beam -->
      <rect x="10" y="-18" width="160" height="18" fill="url(#scanGrad)">
        <animate attributeName="y" from="-18" to="58" dur="2.8s" repeatCount="indefinite" />
      </rect>

      <!-- Spatial Readout -->
      <text x="176" y="24" class="mono" font-size="9.5" font-weight="700" fill="#FBBF24">POSTGIS // SRID:4326</text>
      <text x="176" y="40" class="mono" font-size="9.5" fill="#94A3B8">TKGM ADA/PARSEL SYNC</text>
      <rect x="0" y="0" width="340" height="58" rx="8" fill="none" stroke="#1E293B" stroke-width="1" />
    </g>

    <!-- Feature Bullets -->
    <g transform="translate(20, 146)" class="sans" font-size="12.8" fill="#CBD5E1">
      <text x="0" y="0"><tspan fill="#FBBF24" font-weight="700">▸</tspan> PostGIS MultiPolygon &amp; TKGM parsel entegrasyonu</text>
      <text x="0" y="24"><tspan fill="#FBBF24" font-weight="700">▸</tspan> MapLibre hibrit uydu haritalama &amp; bakım motoru</text>
      <text x="0" y="48"><tspan fill="#FBBF24" font-weight="700">▸</tspan> FastAPI Async + Next.js App Router + Supabase</text>
      <text x="0" y="72"><tspan fill="#FBBF24" font-weight="700">▸</tspan> Chrome Manifest V3 eklentisi &amp; Micro-SaaS</text>
    </g>
  </g>
</svg>
