<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 68" width="100%">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#091324" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.18" />
    </linearGradient>
    <clipPath id="footClip">
      <rect x="2" y="2" width="896" height="64" rx="12" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  </style>

  <g clip-path="url(#footClip)">
    <rect x="0" y="0" width="900" height="68" fill="url(#footBg)" />

    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="10s" repeatCount="indefinite" />
      <path
        d="M 0 48 Q 112.5 28, 225 48 T 450 48 T 675 48 T 900 48 T 1125 48 T 1350 48 L 1350 72 L 0 72 Z"
        fill="url(#waveGrad)"
      />
    </g>

    <circle cx="28" cy="34" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="44" y="38.5" class="mono" font-size="13.5" font-weight="700" fill="#F8FAFC">
      SYSTEM.READY // <tspan fill="#34D399">FinTech, Quant Ar-Ge &amp; Yapay Zeka iş birliklerine açık</tspan>
    </text>

    <text x="724" y="38.5" class="mono" font-size="12.5" font-weight="700" fill="#CBD5E1">
      ALPHA: <tspan fill="#10B981">HIGH ▲</tspan>
    </text>
  </g>

  <rect x="2" y="2" width="896" height="64" rx="12" fill="none" stroke="#1E293B" stroke-width="1.3" />
</svg>
