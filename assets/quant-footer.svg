<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 76" width="100%" height="76">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#091324" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.15" />
    </linearGradient>
    <clipPath id="footClip">
      <rect x="2" y="2" width="1196" height="72" rx="12" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  </style>

  <g clip-path="url(#footClip)">
    <rect x="0" y="0" width="1200" height="76" fill="url(#footBg)" />

    <!-- Animated Subtle Sine Wave -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="12s" repeatCount="indefinite" />
      <path
        d="M 0 56 Q 150 34, 300 56 T 600 56 T 900 56 T 1200 56 T 1500 56 T 1800 56 L 1800 80 L 0 80 Z"
        fill="url(#waveGrad)"
      />
    </g>

    <circle cx="42" cy="38" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="42" class="mono" font-size="12" font-weight="700" fill="#E2E8F0">
      SYSTEM.READY // <tspan fill="#34D399">FinTech, Quant Ar-Ge &amp; Yapay Zeka Mühendisliği iş birliklerine açık</tspan>
    </text>

    <text x="955" y="42" class="mono" font-size="11.5" fill="#94A3B8">
      LATENCY: <tspan fill="#FBBF24" font-weight="700">LOW</tspan>  |  ALPHA: <tspan fill="#10B981" font-weight="700">HIGH</tspan>
    </text>
  </g>

  <rect x="2" y="2" width="1196" height="72" rx="12" fill="none" stroke="#1E293B" stroke-width="1.2" />
</svg>
