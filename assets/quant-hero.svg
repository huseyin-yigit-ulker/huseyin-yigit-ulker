      <rect x="239" y="60" width="10" height="22" rx="1.5" fill="#34D399">
        <animate attributeName="y" values="64;54;68;58;64" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="height" values="18;28;14;24;18" dur="3.2s" repeatCount="indefinite" />
      </rect>

