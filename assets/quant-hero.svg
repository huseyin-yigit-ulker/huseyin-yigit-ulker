    <linearGradient id="askDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.02" />
