    <circle cx="36" cy="19" r="5" fill="#F59E0B" />
    <circle cx="52" cy="19" r="5" fill="#10B981" />
    <text x="70" y="23.5" class="mono" font-size="12.5" font-weight="700" fill="#CBD5E1">QUANT-CORE v5.5</text>
    <line x1="206" y1="8" x2="206" y2="30" stroke="#1E293B" stroke-width="1.2" />

    <!-- Seamless Scrolling FinTech & AI Ticker (Larger 13px Font) -->
    <g clip-path="url(#tickerClip)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1120 0" dur="22s" repeatCount="indefinite" />
        <text x="222" y="23.5" class="mono" font-size="13" fill="#CBD5E1">
          <tspan fill="#10B981" font-weight="700">▲ LOB.IMB +0.78</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#22D3EE" font-weight="700">FFT.DESPOOF [&lt;1.2ms]</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#FBBF24" font-weight="700">PPO.ALPHA PF: 2.41</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#34D399" font-weight="700">PUSU: RSA-ZERO-KNOWLEDGE</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#38BDF8" font-weight="700">POSTGIS + TKGM</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#A78BFA" font-weight="700">YOLOv8: 98.9%</tspan>
          <tspan fill="#475569">  |  </tspan>
        </text>
        <text x="1342" y="23.5" class="mono" font-size="13" fill="#CBD5E1">
          <tspan fill="#10B981" font-weight="700">▲ LOB.IMB +0.78</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#22D3EE" font-weight="700">FFT.DESPOOF [&lt;1.2ms]</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#FBBF24" font-weight="700">PPO.ALPHA PF: 2.41</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#34D399" font-weight="700">PUSU: RSA-ZERO-KNOWLEDGE</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#38BDF8" font-weight="700">POSTGIS + TKGM</tspan>
          <tspan fill="#475569">  |  </tspan>
          <tspan fill="#A78BFA" font-weight="700">YOLOv8: 98.9%</tspan>
          <tspan fill="#475569">  |  </tspan>
        </text>
      </g>
    </g>

    <!-- LEFT SECTION: Bold, High-Priority Typography (x=30..532) -->
    <!-- Status Pill -->
    <rect x="30" y="56" width="440" height="30" rx="15" fill="#064E3B" fill-opacity="0.45" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="48" cy="71" r="8" fill="#10B981" fill-opacity="0.3">
      <animate attributeName="r" values="4;9;4" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.55;0.05;0.55" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="48" cy="71" r="4.2" fill="#10B981" />
    <text x="63" y="75.5" class="mono" font-size="12.5" font-weight="700" fill="#6EE7B7" letter-spacing="0.5">QUANT FINTECH • AGENTIC AI • AGRITECH</text>

    <!-- Hero Name (38px at native 900px = huge & commanding) -->
    <text x="30" y="132" class="sans" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="0.4">HÜSEYİN YİĞİT ÜLKER</text>

    <!-- Role Title (21px bold gradient) -->
    <text x="30" y="166" class="sans" font-size="21" font-weight="700" fill="url(#titleGrad)">Yapay Zeka Mühendisi | FinTech &amp; Quant AI</text>

    <!-- High-Legibility Bio Lines (15.5px crisp bright text) -->
    <text x="30" y="201" class="sans" font-size="15.5" font-weight="600" fill="#E2E8F0">🎓 Hacettepe Üniversitesi Yapay Zeka Mühendisliği</text>
    <text x="30" y="226" class="sans" font-size="15" fill="#CBD5E1">Piyasa mikroyapısı (LOB/HFT), çok modlu ajanlar ve CBS</text>
    <text x="30" y="248" class="sans" font-size="15" fill="#CBD5E1">tabanlı akıllı tarım sistemlerini üretim seviyesinde geliştirir.</text>

    <!-- 3 Feature Domain Pills (13.5px bold) -->
    <g transform="translate(30, 266)">
      <rect x="0" y="0" width="164" height="36" rx="8" fill="#0B1628" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.7" />
