      <g transform="translate(14, 212)">
        <rect x="0" y="6" width="5" height="18" rx="1" fill="#06B6D4">
          <animate attributeName="y" values="12;2;14;6;12" dur="1.5s" repeatCount="indefinite" />
          <animate attributeName="height" values="12;22;10;18;12" dur="1.5s" repeatCount="indefinite" />
