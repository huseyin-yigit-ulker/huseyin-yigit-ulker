    <linearGradient id="bidDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02" />
