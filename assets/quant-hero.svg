      <text x="280" y="152" class="mono" font-size="10.5" fill="#94A3B8">100.0</text>
      <text x="280" y="188" class="mono" font-size="10.5" fill="#94A3B8">96.8</text>

      <!-- Order Book Depth Walls -->
      <path d="M 12 194 L 12 150 L 54 150 L 82 162 L 116 162 L 142 194 Z" fill="url(#bidDepth)">
        <animate attributeName="opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite" />
      </path>
      <path d="M 155 194 L 185 174 L 220 158 L 250 140 L 274 134 L 274 194 Z" fill="url(#askDepth)">
        <animate attributeName="opacity" values="0.6;0.95;0.6" dur="3.5s" repeatCount="indefinite" />
      </path>

      <!-- 10 Crisp Candlesticks -->
      <line x1="26" y1="150" x2="26" y2="182" stroke="#10B981" stroke-width="1.6" />
      <rect x="21" y="158" width="10" height="16" rx="1.5" fill="#10B981" />

      <line x1="50" y1="154" x2="50" y2="186" stroke="#F43F5E" stroke-width="1.6" />
      <rect x="45" y="160" width="10" height="18" rx="1.5" fill="#F43F5E" />

      <line x1="74" y1="138" x2="74" y2="188" stroke="#10B981" stroke-width="1.6" />
