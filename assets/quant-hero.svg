      <line x1="146" y1="104" x2="146" y2="146" stroke="#10B981" stroke-width="1.6" />
      <rect x="141" y="110" width="10" height="28" rx="1.5" fill="#10B981" />

      <line x1="170" y1="108" x2="170" y2="138" stroke="#F43F5E" stroke-width="1.6" />
      <rect x="165" y="114" width="10" height="15" rx="1.5" fill="#F43F5E" />

