      <path d="M 26 168 Q 56 174, 78 148 T 146 118 T 194 98 T 244 62" fill="none" stroke="#F8FAFC" stroke-width="1.2" stroke-opacity="0.7" class="signal-flow" />

      <circle cx="244" cy="62" r="9" fill="#F59E0B" fill-opacity="0.3">
