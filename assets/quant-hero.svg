<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="55%" stop-color="#0A1222" />
      <stop offset="100%" stop-color="#06161B" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="55%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="alphaLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="bidDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="askDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.02" />
    </linearGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <pattern id="quantGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="896" height="360" rx="16" />
    </clipPath>

    <clipPath id="tickerClip">
      <rect x="218" y="4" width="668" height="32" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    @keyframes dashDraw {
      0% { stroke-dashoffset: 480; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -480; }
    }
    .signal-flow {
      stroke-dasharray: 12 7;
      animation: dashDraw 12s linear infinite;
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Background & Grid -->
    <rect x="0" y="0" width="900" height="364" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="900" height="364" fill="url(#quantGrid)" />

    <!-- Ambient Glows -->
    <circle cx="700" cy="155" r="240" fill="url(#glowEmerald)" />
    <circle cx="210" cy="260" r="230" fill="url(#glowCyan)" />

    <!-- Top Market & Telemetry Ticker Bar -->
