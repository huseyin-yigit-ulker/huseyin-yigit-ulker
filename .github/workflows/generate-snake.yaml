name: Generate Snake

on:
  schedule:
    - cron: "0 6 * * 1" # Her Pazartesi 06:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate fintech-themed github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F59E0B&color_dots=#ebedf0,#a7f3d0,#34d399,#10b981,#047857
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F59E0B&color_dots=#161b22,#064e3b,#047857,#10b981,#34d399

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
